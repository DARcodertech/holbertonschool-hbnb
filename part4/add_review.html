<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - HBnB</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="images/icon.png" type="image/png">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="HBnB Logo">
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#" id="login-link" style="display: none;">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="review-form-section">
            <h1>Add Your Review</h1>
            <div id="review-message" class="message" style="display: none;"></div>
            
            <form id="review-form">
                <div class="form-group">
                    <label for="rating">Rating:</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" />
                        <label for="star5" title="5 stars">&#9733;</label>
                        <input type="radio" id="star4" name="rating" value="4" />
                        <label for="star4" title="4 stars">&#9733;</label>
                        <input type="radio" id="star3" name="rating" value="3" />
                        <label for="star3" title="3 stars">&#9733;</label>
                        <input type="radio" id="star2" name="rating" value="2" />
                        <label for="star2" title="2 stars">&#9733;</label>
                        <input type="radio" id="star1" name="rating" value="1" />
                        <label for="star1" title="1 star">&#9733;</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="review-text">Your Review:</label>
                    <textarea id="review-text" name="review-text" rows="6" required></textarea>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn-primary">Submit Review</button>
                    <a href="#" class="btn-secondary" id="back-button">Cancel</a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 HBnB. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is authenticated
            const token = getCookie('token');
            if (!token) {
                // Redirect to login page if not authenticated
                window.location.href = 'login.html';
                return;
            }
            
            // Check authentication status and show login/logout button
            checkAuthenticationForAddReview();
            
            // Get place ID from URL
            const placeId = getPlaceIdFromURL();
            if (!placeId) {
                window.location.href = 'index.html';
                return;
            }
            
            // Setup review form submission
            setupReviewFormSubmission(token, placeId);
            
            // Setup back button
            const backButton = document.getElementById('back-button');
            if (backButton) {
                backButton.href = `place.html?id=${placeId}`;
            }
        });
    </script>
</body>
</html>
